name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:

jobs:
  macos:
    name: macOS app (swiftc)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build universal .app
        run: |
          xcodebuild -version
          cd macos
          # SDK 26+ jest wymagany, żeby na macOS 26 aplikacja miała nowy wygląd systemu
          REQUIRE_SDK_MAJOR=26 UNIVERSAL=1 VERSION=0.0.0 ./build.sh
      - name: Verify clipboard protocol and PNG/TIFF synchronization
        run: bash macos/tests/clipboard-check.sh
      - name: Verify pairing, encrypted sessions and signed update artifacts
        run: bash macos/tests/security-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BorderlessMouse-macOS-ci
          path: macos/build/BorderlessMouse.app
          if-no-files-found: error
  windows:
    name: Windows app (dotnet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore locked dependencies
        run: dotnet restore windows/ClipboardChecks/BorderlessMouse.ClipboardChecks.csproj --locked-mode
      - name: Build
        run: dotnet build windows/BorderlessMouse/BorderlessMouse.csproj -c Release -warnaserror --no-restore
      - name: Verify clipboard protocol, images and concurrent changes
        run: dotnet run --project windows/ClipboardChecks/BorderlessMouse.ClipboardChecks.csproj -c Release --no-restore
      - name: Publish (win-x64, single file)
        run: >
          dotnet publish windows/BorderlessMouse/BorderlessMouse.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          --no-restore -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BorderlessMouse-Windows-ci
          path: publish/BorderlessMouse.exe
          if-no-files-found: error

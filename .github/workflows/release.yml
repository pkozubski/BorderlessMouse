name: Release

# Wypuszczenie wersji: git tag -a v2.0.0 -m "BorderlessMouse v2.0.0" && git push origin v2.0.0
# Darmowa beta zachowuje własny podpis ECDSA artefaktów, ale nie ma jeszcze
# publicznie zaufanego Authenticode ani notarizacji Apple.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal .app)
    runs-on: macos-26
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - name: Import stable release certificate
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: bash macos/ci/import-signing.sh
      - name: Build
        run: |
          xcodebuild -version
          cd macos
          # SDK 26+ jest wymagany, żeby na macOS 26 aplikacja miała nowy wygląd systemu
          REQUIRE_SDK_MAJOR=26 UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" ./build.sh
          echo "Zlinkowane SDK:"
          otool -l build/BorderlessMouse.app/Contents/MacOS/BorderlessMouse | grep -A5 LC_BUILD_VERSION | grep -E "sdk|minos" || true
      - name: Verify signature continuity and update validation
        run: bash macos/tests/signature-check.sh
      - name: Package free beta
        run: |
          cd macos
          ditto -c -k --keepParent build/BorderlessMouse.app BorderlessMouse-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/BorderlessMouse-macOS.zip
          if-no-files-found: error
      - name: Remove temporary signing identity
        if: always()
        timeout-minutes: 1
        run: |
          # Zaufanie do publicznego certyfikatu znika wraz z jednorazowym runnerem.
          security delete-keychain "$RUNNER_TEMP/borderlessmouse-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/borderlessmouse-signing.p12"

  windows:
    name: Windows (x64, single file)
    runs-on: windows-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore locked dependencies
        run: dotnet restore windows/BorderlessMouse/BorderlessMouse.csproj -r win-x64 --locked-mode
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish windows/BorderlessMouse/BorderlessMouse.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version -p:InformationalVersion=$version --no-restore -o publish
          Move-Item publish/BorderlessMouse.exe publish/BorderlessMouse-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            publish/BorderlessMouse-Windows-x64.exe
            publish/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    environment: production-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum BorderlessMouse-macOS.zip BorderlessMouse-Windows-x64.exe THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Sign update artifacts with project key
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          : "${UPDATE_SIGNING_PRIVATE_KEY_PEM:?Brak UPDATE_SIGNING_PRIVATE_KEY_PEM}"
          umask 077
          key="$RUNNER_TEMP/borderlessmouse-update-signing.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_PEM" > "$key"
          cmp <(openssl pkey -in "$key" -pubout -outform DER) \
            <(openssl pkey -pubin -in security/update-signing-public.pem -outform DER)
          openssl dgst -sha256 -sign "$key" -out dist/BorderlessMouse-macOS.zip.sig dist/BorderlessMouse-macOS.zip
          openssl dgst -sha256 -sign "$key" -out dist/BorderlessMouse-Windows-x64.exe.sig dist/BorderlessMouse-Windows-x64.exe
          openssl dgst -sha256 -verify security/update-signing-public.pem \
            -signature dist/BorderlessMouse-macOS.zip.sig dist/BorderlessMouse-macOS.zip
          openssl dgst -sha256 -verify security/update-signing-public.pem \
            -signature dist/BorderlessMouse-Windows-x64.exe.sig dist/BorderlessMouse-Windows-x64.exe
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "BorderlessMouse $GITHUB_REF_NAME" \
            --notes "Bezpłatna beta. Windows może przy pierwszym uruchomieniu pokazać Unknown publisher, a macOS wymagać opcji Open Anyway w Privacy & Security. Nie wyłączaj globalnie SmartScreen ani Gatekeepera. Kolejne aktualizacje są chronione SHA-256 i przypiętym podpisem ECDSA." \
            dist/BorderlessMouse-macOS.zip dist/BorderlessMouse-Windows-x64.exe \
            dist/BorderlessMouse-macOS.zip.sig dist/BorderlessMouse-Windows-x64.exe.sig \
            dist/THIRD_PARTY_NOTICES.txt dist/SHA256SUMS.txt

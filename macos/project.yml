# Projekt Xcode generowany przez XcodeGen:  brew install xcodegen && xcodegen
name: BorderlessMouse
options:
  bundleIdPrefix: com.borderlessmouse
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  BorderlessMouse:
    type: application
    platform: macOS
    sources:
      - path: BorderlessMouse/Sources
      - path: BorderlessMouse/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: BorderlessMouse
        PRODUCT_BUNDLE_IDENTIFIER: com.borderlessmouse.mac
        INFOPLIST_FILE: BorderlessMouse/Info.plist
        CODE_SIGN_ENTITLEMENTS: BorderlessMouse/BorderlessMouse.entitlements
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc; w Xcode wybierz swój Team, żeby uprawnienia TCC nie znikały po każdym buildzie.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
